<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTP Login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  #message { margin-top: 1rem; font-size: 0.9rem; }
  #verify-step { display: none; }
</style>
</head>
<body>
  <h1>Email OTP Login</h1>

  <div id="request-step">
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
    <button id="request-btn">Send code</button>
  </div>

  <div id="verify-step">
    <input id="otp" type="text" inputmode="numeric" placeholder="6-digit code" maxlength="6" />
    <button id="verify-btn">Verify</button>
  </div>

  <div id="message"></div>

  <script>
    const requestStep = document.getElementById('request-step');
    const verifyStep = document.getElementById('verify-step');
    const messageEl = document.getElementById('message');
    const emailInput = document.getElementById('email');
    const otpInput = document.getElementById('otp');

    function showMessage(text, isError = false) {
      messageEl.textContent = text;
      messageEl.style.color = isError ? 'crimson' : 'green';
    }

    document.getElementById('request-btn').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const res = await fetch('/otp/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (res.ok) {
        showMessage(data.message + ' Check the server console for the code (stubbed email).');
        verifyStep.style.display = 'block';
      } else {
        showMessage(data.error, true);
      }
    });

    document.getElementById('verify-btn').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const otp = otpInput.value.trim();
      const res = await fetch('/otp/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otp }),
      });
      const data = await res.json();
      showMessage(data.message || data.error, !res.ok);
    });
  </script>
</body>
</html>
