<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTP Login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  #message { margin-top: 1rem; font-size: 0.9rem; }
  #verify-step { display: none; }
  #whoami { font-size: 0.85rem; color: #555; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
  <div id="whoami">
    <span id="whoami-text">Loading...</span>
    <button id="logout-btn">Log out</button>
  </div>

  <h1>Email OTP Verification</h1>

  <div id="request-step">
    <button id="request-btn">Send code</button>
  </div>

  <div id="verify-step">
    <input id="otp" type="text" inputmode="numeric" placeholder="6-digit code" maxlength="6" />
    <button id="verify-btn">Verify</button>
  </div>

  <div id="message"></div>

  <script>
    const verifyStep = document.getElementById('verify-step');
    const messageEl = document.getElementById('message');
    const otpInput = document.getElementById('otp');
    const whoamiText = document.getElementById('whoami-text');

    function showMessage(text, isError = false) {
      messageEl.textContent = text;
      messageEl.style.color = isError ? 'crimson' : 'green';
    }

    async function loadUser() {
      const res = await fetch('/auth/me');
      if (!res.ok) {
        window.location.href = '/login';
        return;
      }
      const { user } = await res.json();
      whoamiText.textContent = `Signed in as ${user.email}`;
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    document.getElementById('request-btn').addEventListener('click', async () => {
      const res = await fetch('/otp/request', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
      const data = await res.json();
      if (res.ok) {
        showMessage(data.message + ' Check the server console for the code (stubbed email).');
        verifyStep.style.display = 'block';
      } else {
        showMessage(data.error, true);
      }
    });

    document.getElementById('verify-btn').addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      const res = await fetch('/otp/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp }),
      });
      const data = await res.json();
      showMessage(data.message || data.error, !res.ok);
    });

    loadUser();
  </script>
</body>
</html>
